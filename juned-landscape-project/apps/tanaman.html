const pbMemory = new Map();
// Key yang GAGAL ditulis ke penyimpanan permanen (kuota penuh / diblokir). Selama key ada di sini,
// memori adalah sumber kebenaran: getItem tidak boleh mengembalikan versi lama dari localStorage.
const pbDirty = new Set();
let pbPersistent = true, pbBlocked = false;
function pbRefresh(){pbPersistent=!pbBlocked&&pbDirty.size===0}
const pbStore = {
 getItem(k){
  if(pbDirty.has(k)&&pbMemory.has(k))return pbMemory.get(k);
  try{const v=KV.ls.getItem(k);if(v!==null){pbMemory.set(k,v);return v;}return pbMemory.has(k)?pbMemory.get(k):null;}
  catch(e){pbBlocked=true;pbRefresh();return pbMemory.has(k)?pbMemory.get(k):null;}
 },
 setItem(k,v){
  v=String(v);pbMemory.set(k,v);
  try{KV.ls.setItem(k,v);pbDirty.delete(k);}
  catch(e){pbDirty.add(k);pbRefresh();try{showStorageNotice()}catch{}}
  pbRefresh();return true;
 },
 removeItem(k){pbMemory.delete(k);pbDirty.delete(k);try{KV.ls.removeItem(k);}catch(e){pbBlocked=true;}pbRefresh();},
 get persistent(){return pbPersistent;}
};
KV.onError=function(k){pbDirty.add(k);pbRefresh();try{showStorageNotice()}catch(e){}};

  materials=[];const kept=keepRecoveryCopy(MATERIAL_KEY,matRaw);if(!kept)allowWrite=false;changed=true;
  showDataWarning('Katalog material lama tidak dapat dibaca'+(kept?'; salinan data asli disimpan sebagai salinan pemulihan.':' dan salinan pemulihan gagal dibuat, sehingga data lama TIDAK ditimpa.')+' Katalog referensi dipulihkan tanpa menimpa item yang masih bisa dibaca.');
 }

  rabProjects=a.map((p,i)=>normalizeRab(p,i)).filter(Boolean);

 }

 if(allowWrite&&!pbStore.getItem(MATERIAL_MIGRATION_KEY)){
  const keyOf=(m)=>String(m.name||'').trim().toLocaleLowerCase('id-ID')+'|'+String(m.category||'').trim().toLocaleLowerCase('id-ID');

  for(const x of missing){const idx=MATERIAL_STARTER.indexOf(x);materials.push(normalizeMaterial({id:'mat-seed-'+(idx+1),name:x[0],category:x[1],spec:x[2],unit:x[3],waste:x[4],price:0,labor:0,stock:0,supplier:'',notes:'Data katalog awal. Isi harga/upah berdasarkan penawaran pemasok; harga belum diverifikasi.'},idx));}

function runDiagnostics(){
 const issues=[],notes=[],checkIds=(label,arr)=>{const seen=new Set();for(const x of arr){const id=String(x.id??'');if(!id)issues.push(label+': item tanpa ID.');else if(seen.has(id))issues.push(label+': ID duplikat "'+id+'".');seen.add(id)}};
 checkIds('Tanaman',plants);checkIds('Material',materials);checkIds('RAB',rabProjects);
 plants.forEach(p=>{if(!String(p.local||'').trim())issues.push('Tanaman tanpa nama ditemukan.');for(const k of ['height','crown','spacing','price','stock'])if(!Number.isFinite(Number(p[k]))||Number(p[k])<0)issues.push('Nilai '+k+' tidak valid pada tanaman '+(p.local||p.id)+'.')});
 materials.forEach(m=>{if(!String(m.name||'').trim())issues.push('Material tanpa nama ditemukan.');if(!MATERIAL_CATEGORIES.includes(m.category))issues.push('Kategori tidak dikenal pada material '+m.name+'.');if(!String(m.unit||'').trim())issues.push('Satuan kosong pada material '+m.name+'.');for(const k of ['price','labor','stock','waste'])if(!Number.isFinite(Number(m[k]))||Number(m[k])<0)issues.push('Nilai '+k+' tidak valid pada material '+m.name+'.')});
 rabProjects.forEach(p=>{if(!String(p.name||'').trim())issues.push('RAB tanpa nama proyek ditemukan.');p.items.forEach((it,i)=>{if(!Number.isFinite(Number(it.qty))||Number(it.qty)<0)issues.push('Volume item RAB tidak valid: '+p.name+' / item '+(i+1)+'.');if(!Number.isFinite(Number(it.price))||Number(it.price)<0||!Number.isFinite(Number(it.labor))||Number(it.labor)<0)issues.push('Harga/upah item RAB tidak valid: '+p.name+' / item '+(i+1)+'.')})});
 // --- pemeriksaan sinkronisasi & penyimpanan ---
 const tomb=getTombstones();
 plants.forEach(p=>{
  if(tomb[String(p.id)])issues.push('Konflik sinkronisasi: tanaman "'+(p.local||p.id)+'" aktif tetapi juga tercatat terhapus (tombstone); sinkronisasi dapat menghapusnya dari cloud.');
  if(!Number.isFinite(Date.parse(p.updatedAt||'')))issues.push('Tanggal pembaruan tidak valid pada tanaman '+(p.local||p.id)+' (mengganggu penentuan versi terbaru saat sinkronisasi).');
  if('_deleted' in p)issues.push('Field internal _deleted bocor pada tanaman '+(p.local||p.id)+'.');
 });
 let orphan=0;rabProjects.forEach(p=>p.items.forEach(it=>{if(it.materialId&&!materialById(it.materialId))orphan++}));
 if(orphan)notes.push(orphan+' item RAB merujuk material yang sudah tidak ada di katalog. Ini wajar: RAB menyimpan snapshot nama dan harga.');
 const bytes=[KEY,MATERIAL_KEY,RAB_KEY].reduce((n,k)=>n+(pbStore.getItem(k)||'').length*2,0),mb=bytes/1048576;
 if(mb>4)issues.push('Ukuran data ±'+mb.toFixed(1)+' MB mendekati batas penyimpanan browser (±5 MB). Kurangi foto atau ekspor backup.');else notes.push('Perkiraan ukuran data: '+mb.toFixed(2)+' MB dari batas ±5 MB.');
 try{const rc=Object.keys(KV.ls).filter(k=>k.includes('_recovery_')).length;if(rc)notes.push(rc+' salinan pemulihan tersimpan di browser (dibuat otomatis saat data lama tidak terbaca). Aman dihapus setelah Anda memastikan data benar.')}catch{}
 notes.push('Penyimpanan persisten dari browser: '+window.pbPersisted+'.');
 if(/iPhone|iPad|iPod/.test(navigator.userAgent)&&!isStandalone())issues.push('Dibuka lewat tab Safari: iOS dapat menghapus data situs yang tidak dibuka sekitar 7 hari. Pasang ke Layar Utama (Bagikan -> Tambah ke Layar Utama) dan ekspor backup berkala.');
 if(!pbPersistent)issues.push('Penyimpanan permanen browser gagal; perubahan terbaru hanya ada di memori. Ekspor backup sekarang.');
 const box=$('#diagnosticResult');
 if(box){const noteHtml=notes.length?'<ul>'+notes.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'';
  box.innerHTML=(issues.length?'<b>'+issues.length+' temuan:</b><ul>'+issues.slice(0,30).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'+(issues.length>30?'<p>Menampilkan 30 temuan pertama.</p>':''):'<b>Semua pemeriksaan lolos.</b><p>'+plants.length+' tanaman, '+materials.length+' material, '+rabProjects.length+' RAB diperiksa: tidak ada ID duplikat, nilai tidak valid, ataupun konflik sinkronisasi.</p>')+noteHtml;
  box.scrollIntoView({behavior:'smooth',block:'nearest'})}
 toast(issues.length?'Pemeriksaan selesai: '+issues.length+' temuan.':'Pemeriksaan selesai: tidak ada masalah.');return {ok:issues.length===0,issues,notes};
}
function render(){

 catch(err){console.error('PlantBase render failed',err);const box=$('#appError');if(box){box.style.display='block';box.textContent='Sebagian tampilan gagal dimuat: '+(err?.message||String(err))+'. Coba muat ulang halaman. Jika masalah berulang, ekspor data yang masih bisa diakses dan kirim pesan kesalahan ini.';}const c=$('#content');if(c)c.innerHTML='<section class="panel"><h2>Tampilan gagal dimuat</h2><p>PlantBase menangkap kesalahan agar halaman tidak kosong tanpa penjelasan.</p><button class="btn primary" onclick="location.reload()">Muat ulang aplikasi</button></section>';}
}
function filterCatalog(){let q=($('#searchPlants')?.value||'').toLowerCase(),cat=$('#catFilter')?.value||'',sort=$('#sortFilter')?.value||'name';let arr=plants.filter(p=>(!q||[p.local,p.scientific,p.family,p.category].some(v=>String(v||'').toLowerCase().includes(q)))&&(!cat||p.category===cat));arr.sort((a,b)=>sort==='stock'?(+b.stock||0)-(+a.stock||0):sort==='new'?String(b.created||'').localeCompare(String(a.created||'')):String(a.local).localeCompare(String(b.local)));$('#catalogResults').innerHTML=arr.length?arr.map(plantCard).join(''):`<div class="empty" style="grid-column:1/-1"><div class="big">⌕</div><h3>Tanaman tidak ditemukan</h3><p>Coba kata kunci lain atau tambahkan tanaman baru.</p><button class="btn primary" onclick="openForm()">Tambah tanaman</button></div>`;$('#catalogCount').textContent=`Menampilkan ${arr.length} dari ${plants.length} jenis tanaman.`}
function calculatePlantNeed(){const area=Math.max(0,Number($('#calcArea')?.value)||0),spacing=Math.max(0,Number($('#calcSpacing')?.value)||0),extra=Math.min(100,Math.max(0,Number($('#calcExtra')?.value)||0)),price=Math.max(0,Number($('#calcPrice')?.value)||0),pattern=$('#calcPattern')?.value||'square';let base=0;if(area>0&&spacing>0){const sqm=(spacing/100)**2*(pattern==='triangular'?0.8660254:1);base=Math.ceil(area/sqm)}const total=Math.ceil(base*(1+extra/100));if($('#calcBase'))$('#calcBase').textContent=base.toLocaleString('id-ID')+' tanaman';if($('#calcTotal'))$('#calcTotal').textContent=total.toLocaleString('id-ID')+' tanaman';if($('#calcCost'))$('#calcCost').textContent=money(total*price);return {area,spacing,extra,price,pattern,base,total,cost:total*price}}
function syncCalcPlant(){const id=$('#calcPlant')?.value,p=plants.find(x=>String(x.id)===String(id));if(!p)return;if($('#calcSpacing'))$('#calcSpacing').value=Number(p.spacing)>0?p.spacing:60;if($('#calcPrice'))$('#calcPrice').value=Number(p.price)||0;calculatePlantNeed()}

function exportCatalogCSV(){const heads=['Nama lokal','Nama ilmiah','Famili','Kategori','Karakteristik','Tinggi maksimal (cm)','Lebar tajuk (cm)','Jarak tanam (cm)','Cahaya','Penyiraman','Pemupukan','Harga (Rp)','Pemasok','Lokasi','Stok','Satuan','Catatan'];const rows=plants.map(p=>[p.local,p.scientific,p.family,p.category,p.description,p.height,p.crown,p.spacing,p.light,p.water,p.fertilizer,p.price,p.supplier,p.location,p.stock,p.unit,p.notes]);downloadCSV('plantbase-katalog-'+new Date().toISOString().slice(0,10)+'.csv',[heads,...rows]);toast('Ekspor katalog CSV dimulai.')}
function exportPlantEstimate(){const r=calculatePlantNeed();if(!r.base)return toast('Isi luas area dan jarak tanam lebih dari nol.');const p=plants.find(x=>String(x.id)===String($('#calcPlant')?.value));const rows=[['Estimasi Kebutuhan Tanam','Nilai'],['Tanaman',p?.local||'Tanaman belum dipilih'],['Luas area (m²)',r.area],['Jarak tanam (cm)',r.spacing],['Pola tanam',r.pattern==='triangular'?'Segitiga / selang-seling':'Kotak / baris lurus'],['Cadangan (%)',r.extra],['Jumlah dasar',r.base],['Jumlah dengan cadangan',r.total],['Harga satuan (Rp)',r.price],['Estimasi biaya (Rp)',r.cost],['Catatan','Estimasi awal; verifikasi kebutuhan aktual di lapangan.']];downloadCSV('plantbase-estimasi-tanam-'+new Date().toISOString().slice(0,10)+'.csv',rows);toast('Estimasi CSV dibuat.')}
function openForm(id=null){const found=id?plants.find(x=>String(x.id)===String(id)):null;editing=found?found.id:null;let p=found||{};photoData=p.image||'';$('#modalTitle').textContent=id?'Edit data tanaman':'Tambah tanaman baru';$('#modalBody').innerHTML=`<form id="plantForm" onsubmit="savePlant(event)"><div class="formgrid"><div class="field full"><label>Foto utama</label><div class="photo-drop"><div class="photo-preview" id="formPreview">${photoData?`<img src="${esc(photoData)}">`:'🌿'}</div><div><input type="file" id="plantPhoto" accept="image/*"><small>Pilih foto dari Mac/iPhone/iPad. Foto dioptimalkan untuk penyimpanan browser.</small></div></div></div><div class="field"><label>Nama lokal *</label><input name="local" required value="${esc(p.local||'')}" placeholder="Contoh: Pucuk merah"></div><div class="field"><label>Nama ilmiah</label><input name="scientific" value="${esc(p.scientific||'')}" placeholder="Contoh: Syzygium myrtifolium"></div><div class="field"><label>Famili botani</label><input name="family" value="${esc(p.family||'')}" placeholder="Contoh: Myrtaceae"></div><div class="field"><label>Kategori</label><select name="category">${[...new Set([...(p.category&&!['Pohon peneduh','Palem','Tanaman hias daun','Tanaman aksen','Semak / pagar','Ground cover','Rumput','Tanaman air','Sukulen','Lainnya'].includes(p.category)?[p.category]:[]),'Pohon peneduh','Palem','Tanaman hias daun','Tanaman aksen','Semak / pagar','Ground cover','Rumput','Tanaman air','Sukulen','Lainnya'])].map(x=>`<option ${p.category===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field full"><label>Karakteristik / fungsi lanskap</label><textarea name="description" rows="3" placeholder="Bentuk tajuk, warna, fungsi, habitat…">${esc(p.description||'')}</textarea></div><div class="field"><label>Tinggi maksimal (cm)</label><input name="height" type="number" min="0" step="any" value="${esc(p.height||'')}"></div><div class="field"><label>Lebar tajuk (cm)</label><input name="crown" type="number" min="0" step="any" value="${esc(p.crown||'')}"></div><div class="field"><label>Jarak tanam (cm)</label><input name="spacing" type="number" min="0" step="any" value="${esc(p.spacing||'')}"></div><div class="field"><label>Kebutuhan cahaya</label><select name="light"><option value="">Pilih kebutuhan cahaya</option>${[...new Set([...(p.light&&!['Matahari penuh','Semi teduh','Cahaya tidak langsung / teduh terang','Teduh','Matahari / semi teduh'].includes(p.light)?[p.light]:[]),'Matahari penuh','Semi teduh','Cahaya tidak langsung / teduh terang','Teduh','Matahari / semi teduh'])].map(x=>`<option ${p.light===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field full"><label>Panduan penyiraman</label><textarea name="water" rows="2">${esc(p.water||'')}</textarea></div><div class="field full"><label>Panduan pemupukan</label><textarea name="fertilizer" rows="2">${esc(p.fertilizer||'')}</textarea></div><div class="field"><label>Harga satuan (Rp)</label><input name="price" type="number" min="0" step="any" value="${esc(p.price??'')}"></div><div class="field"><label>Nama pemasok / nursery</label><input name="supplier" value="${esc(p.supplier||'')}"></div><div class="field"><label>Lokasi pembelian</label><input name="location" value="${esc(p.location||'')}" placeholder="Kota / alamat nursery"></div><div class="field"><label>Stok tersedia</label><input name="stock" type="number" min="0" step="any" value="${esc(p.stock??0)}"></div><div class="field"><label>Satuan stok</label><select name="unit">${[...new Set([...(p.unit&&!['pot','polybag','batang','pohon','rumpun','m²','unit'].includes(p.unit)?[p.unit]:[]),'pot','polybag','batang','pohon','rumpun','m²','unit'])].map(x=>`<option ${p.unit===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field full"><label>Catatan tambahan</label><textarea name="notes" rows="2">${esc(p.notes||'')}</textarea></div></div><div class="form-actions">${id?`<button type="button" clas function readImage(file,cb){if(!file)return;if(!file.type||!file.type.startsWith('image/'))return toast('Pilih file gambar JPG, PNG, atau format gambar yang didukung.');if(file.size>20*1024*1024)return toast('Ukuran foto maksimal 20 MB sebelum dioptimalkan.');const r=new FileReader();r.onerror=()=>toast('File foto gagal dibaca. Coba pilih file lain.');r.onload=()=>{const im=new Image();im.onload=()=>{try{const max=850,scale=Math.min(1,max/Math.max(im.width,im.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(im.width*scale));canvas.height=Math.max(1,Math.round(im.height*scale));const ctx=canvas.getContext('2d');if(!ctx)throw new Error('Canvas tidak tersedia');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,0,0,canvas.width,canvas.height);cb(canvas.toDataURL('image/jpeg',.68))}catch(err){toast('Foto gagal dioptimalkan: '+err.message)}};im.onerror=()=>toast('Gambar tidak dapat dibaca.');im.src=r.result};r.readAsDataURL(file)}
function savePlant(e){e.preventDefault();if(!String(new FormData(e.target).get('local')||'').trim()){toast('Nama lokal wajib diisi.');return}const before=plants.map(x=>({...x}));const wasEditing=!!editing;const f=new FormData(e.target),v=Object.fromEntries(f.entries()),now=isoNow(),existing=wasEditing?plants.find(x=>x.id===editing):null,p={id:editing||('p-'+Date.now()+'-'+Math.random().toString(36).slice(2,7)),...v,local:String(v.local||'').trim(),scientific:String(v.scientific||'').trim(),image:photoData,height:Math.max(0,Number(v.height)||0),crown:Math.max(0,Number(v.crown)||0),spacing:Math.max(0,Number(v.spacing)||0),price:Math.max(0,Number(v.price)||0),stock:Math.max(0,Number(v.stock)||0),created:existing?.created||now,updatedAt:now};if(wasEditing)plants=plants.map(x=>x.id===editing?p:x);else plants.push(p);const oldTomb=getTombstones(),tomb={...oldTomb};delete tomb[p.id];try{setTombstones(tomb)}catch(err){plants=before;toast('Gagal memperbarui penyimpanan.');return}if(!save()){plants=before;try{setTombstones(oldTomb)}catch{}return}closeModal();render();toast(wasEditing?'Data tanaman diperbarui.':'Tanaman berhasil ditambahkan.')}
function deletePlant(id){if(!confirm('Hapus tanaman ini dari database?'))return;const before=plants;const oldTomb=getTombstones();plants=plants.filter(p=>String(p.id)!==String(id));const tomb={...oldTomb,[id]:isoNow()};try{setTombstones(tomb)}catch(e){plants=before;toast('Gagal menyimpan catatan penghapusan.');return}if(!save()){plants=before;setTombstones(oldTomb);return}closeModal();render();toast('Tanaman dihapus. Sinkronkan untuk menerapkan penghapusan ke cloud.')}

$('#importFile').onchange=async e=>{
 const file=e.target.files[0];if(!file)return;
 const snap={plants,materials,rabs:rabProjects,tomb:getTombstones()};
 try{
  if(file.size>50*1024*1024)throw new Error('File backup lebih dari 50 MB. Gunakan file yang lebih kecil atau kurangi foto.');
  const data=JSON.parse(await file.text()),isArr=Array.isArray(data),arr=isArr?data:data.plants;
  if(!Array.isArray(arr)||arr.some(p=>!p||typeof p!=='object'||Array.isArray(p)||!String(p.local||p.name||'').trim()))throw new Error('Struktur backup tidak sesuai.');
  const hasMat=!isArr&&Array.isArray(data.materials),hasRab=!isArr&&Array.isArray(data.rabProjects);
  const cloudOn=!!(getCloud().url&&getSession());
  if(!confirm('Impor akan mengganti '+snap.plants.length+' tanaman yang ada dengan '+arr.length+' tanaman dari file'+(hasMat?', serta '+snap.materials.length+' material dengan '+data.materials.length:'')+(hasRab?', dan '+snap.rabs.length+' RAB dengan '+data.rabProjects.length:'')+'.'+(cloudOn?'\n\nCloud aktif: hasil impor dianggap versi terbaru dan akan menimpa data cloud pada sinkronisasi berikutnya.':'')+'\n\nLanjutkan?'))return;
  const now=isoNow();
  // Hasil impor diberi cap waktu 'sekarang' agar benar-benar menjadi versi terbaru saat sinkronisasi (semantik 'ganti koleksi').
  const nu=uniqueIds(arr.map((raw,i)=>{const p=normalizePlant(raw,i);if(!p)throw new Error('Ada data tanaman tanpa nama yang valid.');return {...p,updatedAt:now}}),'import');
  const incoming=new Set(nu.list.map(p=>String(p.id)));
  const tomb={...snap.tomb,...(!isArr&&data.tombstones&&typeof data.tombstones==='object'?data.tombstones:{})};
  for(const p of snap.plants)if(!incoming.has(String(p.id)))tomb[String(p.id)]=now;
  for(const id of incoming)delete tomb[id];
  plants=nu.list;setTombstones(tomb);
  if(hasMat)materials=uniqueIds(data.materials.map(normalizeMaterial).filter(Boolean),'import').list;
  if(hasRab)rabProjects=uniqueIds(data.rabProjects.map((p,i)=>normalizeRab(p,i,'rab-import')).filter(Boolean),'import').list;
  if(!save()||!saveMaterialData())throw new Error('Penyimpanan gagal.');
  pbStore.setItem(MATERIAL_MIGRATION_KEY,'1');pbStore.setItem(MATERIAL_SEED_KEY,'1');
  render();toast('Backup berhasil dipulihkan'+(hasMat||hasRab?', termasuk material/RAB.':'. File ini tidak berisi material/RAB, jadi data material/RAB saat ini dipertahankan.'));
 }catch(err){restoreState(snap);toast('File backup tidak valid atau tidak dapat disimpan: '+err.message)}
 finally{e.target.value=''}
};

 plants=[];materials=[];rabProjects=[];
 try{setTombstones(tomb);if(!save()||!saveMaterialData())throw new Error('simpan gagal');pbStore.setItem(MATERIAL_MIGRATION_KEY,'1');pbStore.setItem(MATERIAL_SEED_KEY,'1')}

const CLOUD_KEY='plantbase_cloud_config_v14', AI_KEY='plantbase_ai_endpoint_v14', SESSION_KEY='plantbase_auth_session_v14', TOMBSTONE_KEY='plantbase_tombstones_v14';
function getCloud(){try{return JSON.parse(pbStore.getItem(CLOUD_KEY)||'{}')}catch{return {}}}
function getAI(){return pbStore.getItem(AI_KEY)||''}
function getSession(){try{return JSON.parse(pbStore.getItem(SESSION_KEY)||'null')}catch{return null}}
function setSession(v){if(v)pbStore.setItem(SESSION_KEY,JSON.stringify(v));else pbStore.removeItem(SESSION_KEY)}
function getTombstones(){try{return JSON.parse(pbStore.getItem(TOMBSTONE_KEY)||'{}')}catch{return {}}}
function setTombstones(v){pbStore.setItem(TOMBSTONE_KEY,JSON.stringify(v))}
function isoNow(){return new Date().toISOString()}
function fmtDate(v){const t=Date.parse(v||'');return Number.isFinite(t)?new Date(t).toLocaleDateString('id-ID'):'tanggal tidak diketahui'}
function fillIntegrationSettings(){
 const c=getCloud(), u=$('#sbUrl'), k=$('#sbKey'), a=$('#aiEndpoint');
 if(u)u.value=c.url||''; if(k)k.value=c.key||''; if(a)a.value=getAI();
 const cs=$('#cloudStatus'); if(cs)cs.textContent=c.url&&c.key?'Konfigurasi tersimpan. Login di panel Akun & sinkronisasi.':'Cloud belum dikonfigurasi.';
 const ss=getSession(), auth=$('#authStatus'); if(auth)auth.textContent=ss&&ss.user?'Login sebagai '+ss.user.email+'. Koleksi lokal: '+plants.length+' tanaman.':'Belum login. Konfigurasikan Supabase lalu daftar atau login.';
 const as=$('#aiStatus'); if(as)as.textContent=getAI()?'Endpoint tersimpan. Uji identifikasi dengan foto untuk memeriksa respons.':'Identifikasi AI belum dikonfigurasi.';
}
function saveCloudSettings(){
 const url=($('#sbUrl')?.value||'').trim().replace(/\/+$/,''), key=($('#sbKey')?.value||'').trim();
 if((url&&!/^https:\/\/[a-zA-Z0-9.-]+\.supabase\.co$/.test(url))||(!url&&key)||(url&&!key)){toast('Isi URL Supabase dan anon/public key secara berpasangan.');return false}
 try{pbStore.setItem(CLOUD_KEY,JSON.stringify({url,key}));fillIntegrationSettings();toast(url?'Konfigurasi cloud disimpan pada browser ini.':'Konfigurasi cloud dihapus dari browser ini.');return true}catch(e){toast('Konfigurasi tidak dapat disimpan di browser.');return false}
}
function saveAISettings(){
 const url=($('#aiEndpoint')?.value||'').trim();
 if(url && !/^https?:\/\//i.test(url)){toast('Endpoint harus berupa URL http(s).');return}if(url && location.protocol==='https:' && /^http:\/\//i.test(url) && !/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\//i.test(url)){toast('Halaman HTTPS tidak dapat memanggil endpoint HTTP karena mixed content. Gunakan endpoint HTTPS.');return}
 try{pbStore.setItem(AI_KEY,url);fillIntegrationSettings();toast('Endpoint AI disimpan.')}catch(e){toast('Endpoint AI tidak dapat disimpan di browser.')}
}
async function cloudFetch(path,options={}){
 const c=getCloud(); if(!c.url||!c.key)throw new Error('Simpan URL dan anon/public key Supabase terlebih dahulu.');
 const sess=getSession(); const headers={apikey:c.key,'Content-Type':'application/json',...(options.headers||{})};
 if(sess&&sess.access_token)headers.Authorization='Bearer '+sess.access_token;
 const r=await fetch(c.url+path,{...options,headers});
 if(!r.ok){let msg='HTTP '+r.status;try{const d=await r.json();msg=d.msg||d.message||d.error_description||d.error||msg}catch{};throw new Error(msg)}
 if(r.status===204)return null; const t=await r.text();return t?JSON.parse(t):null;
}
async function ensureFreshSession(){
 const c=getCloud();if(!c.url||!c.key)throw new Error('Konfigurasikan URL dan anon/public key Supabase terlebih dahulu.');
 let ss=getSession();if(!ss||!ss.refresh_token)throw new Error('Silakan login terlebih dahulu.');
 if(ss.expires_at && Date.now()<ss.expires_at-60000)return ss;
 const r=await fetch(c.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:c.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:ss.refresh_token})});
 if(!r.ok){setSession(null);throw new Error('Sesi berakhir. Login kembali.')}const d=await r.json();ss={...d,expires_at:Date.now()+(Number(d.expires_in||3600)*1000)};setSession(ss);return ss;
}
async function authAction(mode){
 const c=getCloud(),email=($('#authEmail')?.value||'').trim(),password=$('#authPassword')?.value||'',out=$('#authStatus');
 if(!c.url||!c.key){out.textContent='Isi URL dan anon/public key lalu simpan konfigurasi terlebih dahulu.';return}
 if(!email||password.length<6){out.textContent='Masukkan email valid dan password minimal 6 karakter.';return}
 out.textContent=mode==='signup'?'Membuat akun…':'Login…';
 try{
  const path=mode==='signup'?'/auth/v1/signup':'/auth/v1/token?grant_type=password';
  const r=await fetch(c.url+path,{method:'POST',headers:{apikey:c.key,'Content-Type':'application/json'},body:JSON.stringify({email,password})});
  const d=await r.json();if(!r.ok)throw new Error(d.msg||d.message||d.error_description||d.error||('HTTP '+r.status));
  if(mode==='signup'&&!d.access_token){out.textContent='Pendaftaran berhasil. Jika konfirmasi email aktif, buka tautan di email lalu login.';toast('Periksa email untuk konfirmasi akun.');return}
  setSession({...d,expires_at:Date.now()+(Number(d.expires_in||3600)*1000)});out.textContent='Login berhasil sebagai '+(d.user?.email||email)+'.';toast('Login Supabase berhasil.');
 }catch(e){out.textContent='Autentikasi gagal: '+e.message;toast('Login/pendaftaran gagal.');}
}
function authLogout(){setSession(null);const out=$('#authStatus');if(out)out.textContent='Logout berhasil. Data lokal tetap tersimpan di perangkat ini.';toast('Logout berhasil.');}
async function testCloud(){
  const out=$('#cloudStatus');if(!saveCloudSettings()){if(out)out.textContent='Perbaiki URL dan anon/public key sebelum menguji koneksi.';return}const c=getCloud();if(!c.url||!c.key){out.textContent='Isi URL dan anon/public key terlebih dahulu.';return}
 out.textContent='Menguji koneksi REST…';
 try{const r=await fetch(c.url+'/rest/v1/plantbase_records_v14?select=id&limit=1',{headers:{apikey:c.key,Authorization:'Bearer '+c.key}});if(r.ok){out.textContent='REST API terjangkau. Untuk membaca data pribadi, login dan gunakan tombol Sinkronkan sekarang.';toast('Koneksi Supabase berhasil.')}else{let t=await r.text();out.textContent='REST API merespons '+r.status+': '+t.slice(0,180);}}
 catch(e){out.textContent='Tidak dapat menghubungi Supabase. Periksa URL dan koneksi internet.';}
}
const tsOf=v=>{const t=Date.parse(v||'');return Number.isFinite(t)?t:0};
const isoOf=v=>new Date(tsOf(v)).toISOString(); // selalu ISO valid agar Postgres tidak menolak seluruh batch
function buildLocalRecords(plantList,tomb){
 const map=new Map();
 for(const p of plantList){const id=String(p.id),{_deleted,...rest}=p;map.set(id,{id,payload:{...rest,_deleted:false},updated_at:isoOf(p.updatedAt||p.created),origin:'local'})}
 for(const [id,at] of Object.entries(tomb||{})){const prev=map.get(id);if(!prev||tsOf(at)>=tsOf(prev.updated_at))map.set(id,{id,payload:{id,_deleted:true},updated_at:isoOf(at),origin:'local'})}
 return map;
}
// Last-write-wins per record. Seri (waktu sama) dimenangkan lokal agar tidak ada upload yang tidak perlu.
function mergeRecords(plantList,tomb,remote){
 const merged=buildLocalRecords(plantList,tomb);
 for(const rr of (remote||[])){const id=String(rr.id),cur=merged.get(id),at=rr.updated_at||rr.payload?.updatedAt||EPOCH_TS;
  if(!cur||tsOf(at)>tsOf(cur.updated_at))merged.set(id,{id,payload:rr.payload||{},updated_at:at,origin:'remote'})}
 return merged;
}
function applyMerged(merged){
 const nextPlants=[],nextTomb={};let skipped=0;
 for(const x of merged.values()){
  if(x.payload&&x.payload._deleted)nextTomb[x.id]=x.updated_at;
  else{const p=normalizePlant({...(x.payload||{}),id:x.id,updatedAt:x.updated_at});if(p)nextPlants.push(p);else skipped++}
 }
 return {nextPlants,nextTomb,skipped};
}
function chunkBySize(rows,maxBytes=900000,maxCount=50){const out=[];let cur=[],size=0;for(const r of rows){const n=JSON.stringify(r).length;if(cur.length&&(size+n>maxBytes||cur.length>=maxCount)){out.push(cur);cur=[];size=0}cur.push(r);size+=n}if(cur.length)out.push(cur);return out}
// PostgREST membatasi jumlah baris per respons (umumnya 1000) tanpa pemberitahuan; baca per halaman sampai habis.
async function fetchAllRemote(uid){
 const out=[],page=200;
 for(let off=0,guard=0;guard<500;guard++){
  const rows=await cloudFetch('/rest/v1/plantbase_records_v14?select=id,payload,updated_at&owner_id=eq.'+enc(uid)+'&order=id.asc&limit='+page+'&offset='+off,{method:'GET'});
  const list=Array.isArray(rows)?rows:[];if(!list.length)break;out.push(...list);off+=list.length;
 }
 return out;
}
let syncing=false;
async function syncCloud(){
 if(syncing){toast('Sinkronisasi sedang berjalan.');return}
 syncing=true;
 const say=t=>{const o=$('#authStatus');if(o)o.textContent=t};
 try{
  say('Menyiapkan sinkronisasi…');
  const ss=await ensureFreshSession(),uid=ss.user?.id;if(!uid)throw new Error('Sesi tidak berisi ID pengguna. Login kembali.');
  say('Mengunduh data cloud…');
  const remote=await fetchAllRemote(uid),remoteById=new Map(remote.map(r=>[String(r.id),r]));
  const merged=mergeRecords(plants,getTombstones(),remote);
  // Unggah hanya record yang benar-benar lebih baru / belum ada di cloud.
  const toPush=[];
  for(const x of merged.values()){if(x.origin!=='local')continue;const r=remoteById.get(x.id);if(!r||tsOf(x.updated_at)>tsOf(r.updated_at))toPush.push({id:x.id,owner_id:uid,payload:x.payload,updated_at:x.updated_at})}
  const batches=chunkBySize(toPush);
  for(let i=0;i<batches.length;i++){say('Mengunggah '+(i+1)+'/'+batches.length+'…');await cloudFetch('/rest/v1/plantbase_records_v14?on_conflict=owner_id,id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(batches[i])})}
  // Cloud kini sama dengan 'merged'. Gabungkan lagi dengan keadaan lokal TERKINI: edit yang dibuat selama proses async ini
  // memiliki cap waktu lebih baru, sehingga tidak tertimpa dan akan terunggah pada sinkronisasi berikutnya.
  const cloudNow=[...merged.values()].map(x=>({id:x.id,payload:x.payload,updated_at:x.updated_at}));
  const finalMerged=mergeRecords(plants,getTombstones(),cloudNow);
  const {nextPlants,nextTomb,skipped}=applyMerged(finalMerged);
  const priorPlants=plants,priorTomb=getTombstones();plants=nextPlants;
  try{setTombstones(nextTomb)}catch(err){plants=priorPlants;throw new Error('Tidak dapat menyimpan catatan sinkronisasi lokal: '+err.message)}
  if(!save()){plants=priorPlants;try{setTombstones(priorTomb)}catch{};throw new Error('Hasil sinkronisasi tidak dapat disimpan di perangkat. Kosongkan ruang penyimpanan lalu ulangi.')}
  const pulled=[...finalMerged.values()].filter(x=>x.origin==='remote'&&!(x.payload&&x.payload._deleted)).length;
  const pending=[...finalMerged.values()].filter(x=>{const m=merged.get(x.id);return x.origin==='local'&&m&&tsOf(x.updated_at)>tsOf(m.updated_at)}).length;
  render();
  say('Sinkronisasi berhasil · '+plants.length+' tanaman aktif · ↑ '+toPush.length+' diunggah · ↓ '+pulled+' diterima · '+Object.keys(nextTomb).length+' catatan hapus.'+(pending?' '+pending+' perubahan baru menunggu sinkronisasi berikutnya.':'')+(skipped?' '+skipped+' record cloud tidak valid dilewati.':'')+' Terakhir: '+new Date().toLocaleString('id-ID'));
  toast('Sinkronisasi selesai.');
 }catch(e){say('Sinkronisasi gagal: '+e.message+'. Data lokal tidak diubah. Periksa SQL/RLS V1.4, URL, key, dan status login.');toast('Sinkronisasi gagal.');}
 finally{syncing=false}
}
async function identifyWithAI(){
 const endpoint=getAI();
 if(!identifyData){toast('Pilih foto terlebih dahulu.');return}
 if(!endpoint){toast('AI belum aktif. Isi endpoint pada Pengaturan & Backup.');setPage('settings');return}
 const status=$('#identifyStatus');if(status)status.textContent='Mengirim foto ke endpoint AI…';
 try{
  const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:identifyData,format:'data_url',language:'id'})});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const data=await r.json(), candidates=Array.isArray(data.candidates)?data.candidates:[];
  if(!candidates.length)throw new Error('Respons tidak berisi candidates.');
  const first=candidates[0];
  const form=$('#identifyForm');
  if(form){form.elements.local.value=first.commonName||first.localName||first.scientificName||'';form.elements.scientific.value=first.scientificName||'';form.elements.description.value='Kandidat dari AI; confidence: '+(first.confidence==null?'tidak tersedia':(Number(first.confidence)>1?Number(first.confidence)+'%':Math.round(Number(first.confidence)*100)+'%'))+'. Verifikasi identitas sebelum disimpan.'}
  if(status)status.innerHTML='<b>Kandidat AI ditemukan:</b> '+candidates.slice(0,5).map(x=>esc(x.commonName||x.scientificName||'Tanpa nama')+' ('+esc(x.scientificName||'')+')'+(x.confidence!=null?' — '+Math.round(Math.max(0,Math.min(1,Number(x.confidence)>1?Number(x.confidence)/100:Number(x.confidence)))*100)+'%':'')).join('<br>');
  toast('Kandidat AI dimuat. Verifikasi sebelum menyimpan.');
 }catch(e){if(status)status.textContent='Identifikasi gagal: '+e.message+'. Pastikan endpoint menerima JSON {image, format, language} dan mengembalikan {candidates:[…]}.';toast('AI tidak berhasil mengidentifikasi foto.')}
}
