<style>

*{box-sizing:border-box}

.x{background:none;color:var(--mut);padding:0 4px;font-size:18px}
.tl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}

.tk{position:relative;height:20px;background:var(--moss2);border-radius:4px}

.empty{color:var(--mut);padding:30px;text-align:center}

.ph{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.ph img{height:110px;border-radius:6px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}th{background:var(--moss2)}td.n,th.n{text-align:right}
.sync{font-size:12px;color:var(--mut)}
.tabs{flex-wrap:wrap}.sm{padding:3px 9px;font-size:13px;margin-left:4px}.bd{font-size:11px;background:#fef3c7;color:#92400e;border-radius:10px;padding:1px 7px}.bd.ok{background:#dcfce7;color:#166534}.bd.no{background:#fee2e2;color:#991b1b}
.cg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.ch{font-size:12px;color:var(--mut);text-align:center}.cc{border:1px solid var(--line);border-radius:6px;min-height:64px;padding:4px;font-size:12px}.ev{background:var(--moss2);border-radius:3px;padding:1px 4px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk i{cursor:grab;touch-action:none;min-width:6px}.tk i:active{cursor:grabbing}.tk b{position:absolute;top:0;width:9px;height:100%;cursor:ew-resize;touch-action:none}.tk b.hl{left:0}.tk b.hr{right:0}.tk s{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--clay)}
.tabs{flex-wrap:nowrap;overflow-x:auto;gap:2px;border-bottom:1px solid var(--line);margin:14px 0 18px;scrollbar-width:thin}.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--mut);padding:10px 14px;white-space:nowrap;flex:none}.tabs button.on{background:none;color:var(--moss);border-bottom-color:var(--moss)}.tabs button.g:hover{color:var(--ink)}
#app img{cursor:zoom-in}
@media print{header button,.add,.tabs,.x{display:none}}
</style>

 var c=[0,0,0];all.forEach(function(o){c[o.t.s]++});

 ST.forEach(function(nm,i){h+='<div class="ln"><span>'+nm+'</span><b>'+c[i]+'</b></div><div class="bar" style="margin:4px 0 8px"><i style="width:'+Math.round(c[i]/n*100)+'%;background:'+CL[i]+'"></i></div>'});

function board(p){

  h+='</div>'});

  h+='<div class="tr"><div class="lb" title="'+E(t.t)+'">'+E(t.t)+(t.dep?' &#8627;':'')+' <span class="m" id="dl'+t.id+'">'+fd(t.a)+' - '+fd(t.b)+'</span></div><div class="tk">'+(td>0&&td<100?'<s style="left:'+td+'%"></s>':'')+'<i data-g="'+t.id+'" style="left:'+l+'%;width:'+w+'%;opacity:'+(t.s==2?.55:1)+';--c:'+((CAT(t.k)||{}).c||CL[t.s])+'"><b class="hl" data-e="l"></b><b class="hr" data-e="r"></b></i></div></div>'});

var KT=["Tanaman","Material","Upah","Lainnya"];

 var rows=[["Item","Jenis pekerjaan","Tugas terkait","Tipe biaya","Jumlah","Satuan","Harga satuan","Total"]];
